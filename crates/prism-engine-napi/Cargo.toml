[package]
name = "prism-engine-napi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NAPI bindings for prism-engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi4"] }
napi-derive = { version = "3", features = ["type-def"] }
prism-engine = { path = "../prism-engine" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
napi-build = "2"
