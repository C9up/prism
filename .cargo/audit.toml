# What `cargo audit --deny warnings` may pass over in prism, and why.
#
# CI runs `cargo audit --deny warnings` from this directory, so every
# advisory fails the release, unmaintained and unsound ones included, unless
# it is listed here. An entry is a claim that has to stay checkable: say why it
# cannot be removed today and what upstream release lets it go.

[advisories]
ignore = [
  # RUSTSEC-2024-0436: `paste` is unmaintained, no fixed release. It is a
  # compile-time proc-macro with no runtime code. It comes in through `image`'s
  # EXR and AVIF encoders: `rav1e` 0.8.1 (ravif, the AVIF encoder) and `pulp`
  # (exr 1.74.2). Both are latest releases on the `image` 0.25 line, and both
  # formats are part of what prism converts.
  # DROP WHEN a rav1e release no longer depends on paste (exr 1.74.3 already
  # dropped pulp), then `cargo update -p rav1e -p exr`.
  "RUSTSEC-2024-0436",

  # RUSTSEC-2026-0192: `ttf-parser` is unmaintained, no fixed release. It parses
  # the font a caller hands to `watermarkText` (crates/prism-engine/src/text.rs,
  # through ab_glyph -> owned_ttf_parser). That font is input from outside, so
  # this is an accepted exposure, not a dismissed one: an application that
  # watermarks with a font it did not author should treat the font as untrusted.
  # ab_glyph 0.2.32 is the latest release and still sits on ttf-parser.
  # DROP WHEN ab_glyph (or a replacement rasteriser prism moves to) is built on
  # `skrifa`, the replacement the advisory names.
  "RUSTSEC-2026-0192",
]
